{% extends 'base.html' %}
{% block title %}Choose New Password - FREKS{% endblock %}

{% block content %}
<div class="form-page">
  <div class="form-card">
    <div class="form-logo">
      <svg width="100" height="30" viewBox="0 0 100 30" fill="none">
        <text x="0" y="24" font-family="Space Mono" font-weight="700" font-size="24" fill="#76ff03" letter-spacing="4">FREKS</text>
      </svg>
    </div>
    <div class="form-title">NEW PASSWORD</div>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div class="field">
        <label>PASSWORD</label>
        <input type="password" name="password" placeholder="Min. 8 characters" required autocomplete="new-password"/>
      </div>

      <div class="field">
        <label>CONFIRM PASSWORD</label>
        <input type="password" name="confirm_password" placeholder="Repeat password" required autocomplete="new-password"/>
      </div>

      <button type="submit" class="btn btn--primary btn--full">
        <span>Update Password</span>
      </button>
    </form>

    <div class="form-divider">OR</div>

    <a href="{{ url_for('auth.login') }}" class="btn btn--ghost btn--full">
      <span>Back to Login</span>
    </a>
  </div>
</div>
{% endblock %}
